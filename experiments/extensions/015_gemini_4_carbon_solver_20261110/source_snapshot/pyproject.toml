[project]
name = "benchbench"
version = "0.1.0"
description = "A reproducible harness for model-created benchmark experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "beautifulsoup4==4.13.5",
  "huggingface-hub==0.36.2",
  "pandas==3.0.5",
  "pyarrow==24.0.0",
  "requests==2.34.2",
  "scikit-learn==1.4.2",
  "scipy==1.16.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
